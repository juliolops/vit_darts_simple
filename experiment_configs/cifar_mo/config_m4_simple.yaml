# Simple CIFAR-10 multi-objective experiment tuned for a MacBook Air M4
# (CPU-only run: this codebase only detects CUDA and falls back to CPU on
# Apple Silicon, so there is no MPS acceleration path here).
# Objectives: accuracy + parameter count + FLOPs (all deterministic, no
# timing-based metric, so results are reproducible run to run).
# Based on experiment_configs/cifar_mo/config0_3_flops.yaml with smaller
# epochs/data/batch size so a full NSGA-III search finishes in minutes
# instead of hours on a laptop CPU.

QNAS:
    crossover_rate: 0.5
    max_generations: 150
    max_num_nodes: 20
    num_quantum_ind: 5
    penalize_number: 3
    repetition: 4
    replace_method: best
    update_quantum_gen: 1
    crossover_frequency: 1
    pop_crossover_rate: 0.4 # offspring replacement proportion in the population
    pop_crossover_method: ['hux', 'one_point', 'two_point'] # 'hux' | 'one_point' | 'two_point'
    mo_crossover_strategy: directional # random_elite
    patience: 60
    elite_mode: global_k # "single" | "global_k" | "bootstrap_k" | "old"
    k_elites: 5
    pool_factor: 3
    ema_beta: 0.7
    rank_weighting: True
    initial_prob_distribution: from_config # from_config | uniform

    # --- Network Architecture Rules ---
    terminal_op_name: "no_op"
    pool_op_name: "pool"
    min_active_len: 1
    truncate_after_noop: false
    avoid_consecutive_pool: false
    enforce_noop_in_update: true
    noop_max_prob: 0.9
    noop_ramp_cap: true

    quantum_update_config:
      quantum_rate_schedule: 'cosine'
      max_update_schedule: 'cosine'
      static_quantum_rate: 0.1
      static_max_update: 0.05
      quantum_rate_schedule_params:
          start: 0.25
          end: 0.1
      max_update_schedule_params:
          start: 1.0
          end: 0.8
      intensity_min: 0.5
      intensity_max: 1.0

    params_ranges:
      decay: 0.9
      learning_rate: 0.001
      momentum: 0.0
      weight_decay: 1.0e-4
      backbone_percentage: [0.1, 0.999]

    function_dict:  {'conv_1_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 1, 'strides': 1, 'filters': 32}, 'prob': 1.0/3.0/8.0},
                     'conv_1_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 1, 'strides': 1, 'filters': 64}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 32}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 64}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_128': {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 128}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_256': {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 256}, 'prob': 1.0/3.0/8.0},
                     'conv_5_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 5, 'strides': 1, 'filters': 32}, 'prob': 1.0/3.0/8.0},
                     'conv_5_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 5, 'strides': 1, 'filters': 64}, 'prob': 1.0/3.0/8.0},
                     'max_pool_2_2': {'function': 'MaxPooling', 'params': {'kernel': 2, 'strides': 2}, 'prob': 1.0/3.0/2.0},
                     'avg_pool_2_2': {'function': 'AvgPooling', 'params': {'kernel': 2, 'strides': 2}, 'prob': 1.0/3.0/2.0},
                     'no_op':        {'function': 'NoOp', 'params': {}, 'prob': 1.0/3.0}}

train:
    batch_size: 128
    eval_batch_size: 128
    max_epochs: 6
    epochs_to_eval: 3
    eval_window_agg: mean   # unbiased on a small validation set
    optimizer: AdamW
    precision: fp32          # bf16/fp16 need CUDA hardware; this run is CPU-only
    device: cpu              # informational only; core/evaluation.py forces cpu when no CUDA

    # Dataset
    dataset: Cifar10
    config_path_dataset: dataset_configs/cifar10.yaml
    data_path: /path/to/datasets/cifar10   # overridden by --data_path on the CLI
    train_split: 0.9
    split_seed: 2025
    loader_seed: 777
    download: true
    stats_max_batches: 10
    data_augmentation: false
    subtract_mean: true
    limit_data: true
    limit_data_value: 1500   # small CIFAR-10 subset so a laptop run finishes quickly
    num_workers: 2

    # Hardware settings - parallelization
    threads: 4                # one evaluation worker per M4 performance core
    train_timeout: 1800       # 30 min safety cap per candidate

    # Network structure Configuration
    network_config: default
    backbone_name: mobilenet_v3_small

    # Multi-objective parameters
    multi_objective: True
    num_objectives: 3
    objectives: ['best_accuracy', 'total_params', 'total_flops']
    metrics:
      - name: Accuracy
      - name: HardwareMetrics
      - name: ValidationLossFitness
      - name: ScalarizedFitness
        params:
          metric_type: loss
          normalizers:
            total_params: 114090
            total_flops: 5.0e+8
    artifacts:
      - name: ConfusionMatrix
