# Multi-objective fairness search: (best_accuracy, fairness_spd, fairness_mean_tpr).
# Training on person_bin_96 (binary person detection, 96×96); fairness
# evaluated on FACET (eval_dataset_path in FairnessMetric below).
# Configuration file 1 : group 1

QNAS:
    crossover_rate: 0.5
    max_generations: 100
    max_num_nodes: 20
    num_quantum_ind: 6
    penalize_number: 3
    repetition: 4
    replace_method: best
    update_quantum_gen: 1
    crossover_frequency: 1
    pop_crossover_rate: 0.4 # offspring replacement proportion in the population
    pop_crossover_method: ['hux', 'one_point', 'two_point'] # 'hux' | 'one_point' | 'two_point'
    mo_crossover_strategy: directional # random_elite
    patience: 60
    elite_mode: global_k # "single" | "global_k" | "bootstrap_k" | "old"
    k_elites: 5
    pool_factor: 3
    ema_beta: 0.7
    rank_weighting: True
    initial_prob_distribution: from_config # from_config | uniform

    # --- Network Architecture Rules ---
    terminal_op_name: "no_op"
    pool_op_name: "pool"
    min_active_len: 1
    truncate_after_noop: false
    avoid_consecutive_pool: false
    enforce_noop_in_update: true
    noop_max_prob: 0.9
    noop_ramp_cap: true

    quantum_update_config:
      quantum_rate_schedule: 'cosine'                     # use 'cosine' schedule or 'static'
      max_update_schedule: 'cosine'                       # use 'cosine' schedule or 'static'
      static_quantum_rate: 0.1                            # (Your old 0.4 / 5)
      static_max_update: 0.05                             # (Your old 0.105 / 5)
      quantum_rate_schedule_params:                       # Parameters for 'cosine cyclic' rate schedule
          start: 0.25                                      # Scaled down from 0.4
          end: 0.1                                       # Scaled down from ~0.01
      max_update_schedule_params:                         # Parameters for 'cosine annealing' max_update schedule
          start: 1.0                                      # if F <= 12: start * 0.07 ; if F <= 32: start * 0.05
          end: 0.8                                       
      intensity_min: 0.5                                  # Intensity sampling range - not used
      intensity_max: 1.0                                  # Intensity sampling range - not used

    params_ranges:
      decay: 0.9
      learning_rate: 0.001
      momentum: 0.0
      weight_decay: 1.0e-4
      backbone_percentage: [0.1, 0.999]

    function_dict:  {'conv_1_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 1, 'strides': 1, 'filters': 32}, 'prob': 1.0/3.0/8.0},
                     'conv_1_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 1, 'strides': 1, 'filters': 64}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 32}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 64}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_128': {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 128}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_256': {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 256}, 'prob': 1.0/3.0/8.0},
                     'conv_5_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 5, 'strides': 1, 'filters': 32}, 'prob': 1.0/3.0/8.0},
                     'conv_5_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 5, 'strides': 1, 'filters': 64}, 'prob': 1.0/3.0/8.0},
                     'max_pool_2_2': {'function': 'MaxPooling', 'params': {'kernel': 2, 'strides': 2}, 'prob': 1.0/3.0/2.0},
                     'avg_pool_2_2': {'function': 'AvgPooling', 'params': {'kernel': 2, 'strides': 2}, 'prob': 1.0/3.0/2.0},
                     'no_op':        {'function': 'NoOp', 'params': {}, 'prob': 1.0/3.0}}

train:
    batch_size: 128
    eval_batch_size: 128
    max_epochs: 50
    epochs_to_eval: 5
    eval_window_agg: mean  # how best_accuracy is aggregated over the eval window: max | mean | last
    optimizer: AdamW
    precision: bf16        # fp32|fp16|bf16
    device: cuda:0

    # Dataset — person_bin_96: binary person detection, 96×96, ImageFolder layout
    dataset: person_bin_96
    config_path_dataset: dataset_configs/person_bin_96.yaml
    data_path: datasets/personbin_data_96
    train_split: 0.9
    split_seed: 2025                             # controls split & balanced limiting
    loader_seed: 777                             # controls DataLoader shuffling
    download: false                              # local dataset, not torchvision-downloadable
    stats_max_batches: 10                        # unused (stats_mode: known in person_bin_96.yaml)
    data_augmentation: false
    subtract_mean: true
    limit_data: false
    limit_data_value: 10000
    num_workers: 4

    # Hardware settings - parallelization
    threads: 20
    train_timeout: 10800  # per-candidate limit in seconds (3 h); 96×96 images need more than the 1.5 h default

    # Network structure Configuration
    network_config: default
    backbone_name: mobilenet_v3_small

    # Multi-objective parameters
    multi_objective: True
    num_objectives: 3
    objectives: ['best_accuracy', 'fairness_spd', 'fairness_mean_tpr']
    metrics:
      - name: Accuracy
      - name: FairnessMetric
        params:
          eval_dataset_name: 'facet'
          eval_skintone_method: 'soft'
          eval_dataset_path: 'datasets/facet_data/facet_eval.csv'
          optimization_objective: 'spd_sum'
          beta: 0.2
          cache_dir: '.cache/facet_crops'
          square_mode: letterbox
          batch_size_fairness: 128
    artifacts:
      - name: ConfusionMatrix
