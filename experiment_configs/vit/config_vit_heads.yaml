# Multi-objective search (NSGA-III) over ViT pruning on CIFAR-10.
#
# Chromosome: one gene per transformer block (max_num_nodes = 12 for
# vit_base_patch16_224). Each gene is the PERCENTAGE of attention heads that
# block keeps; which heads survive is decided by the DARTS alphas computed
# beforehand (run_darts_alphas.py) -- a gene of 40% keeps the 40% of heads
# with the largest alpha. Search space: 20% to 90% in steps of 10.
#
# Objectives: accuracy (up) vs FLOPs (down). Every candidate is fine-tuned
# with ONLY the classifier head trainable, so accuracy reflects the pruned
# representation rather than a full retraining of the backbone.
#
# Prerequisite:
#   python run_darts_alphas.py --output darts_alphas/vit_base_cifar10.json

QNAS:
    max_num_nodes: 12
    params_ranges:
      decay: 0.9
      learning_rate: 0.001
      momentum: 0.0
      weight_decay: 1.0e-4

    function_dict:  {'heads_20': {'params': {'percent': 20}},
                     'heads_30': {'params': {'percent': 30}},
                     'heads_40': {'params': {'percent': 40}},
                     'heads_50': {'params': {'percent': 50}},
                     'heads_60': {'params': {'percent': 60}},
                     'heads_70': {'params': {'percent': 70}},
                     'heads_80': {'params': {'percent': 80}},
                     'heads_90': {'params': {'percent': 90}}}

train:
    # --- ViT ---
    vit_model_name: vit_base_patch16_224
    vit_pretrained: true
    vit_alphas_path: darts_alphas/vit_base_cifar10.json

    batch_size: 32
    eval_batch_size: 32
    max_epochs: 3          # head-only fine-tune: a few epochs is enough
    epochs_to_eval: 2
    eval_window_agg: mean
    optimizer: AdamW
    precision: fp32
    device: cpu            # informational; the worker picks cuda/mps/cpu

    # Dataset (224x224 + ImageNet normalization for the pretrained ViT)
    dataset: Cifar10
    config_path_dataset: dataset_configs/cifar10_vit.yaml
    data_path: data
    train_split: 0.9
    split_seed: 2025
    loader_seed: 777
    download: true
    stats_max_batches: 10
    data_augmentation: false
    subtract_mean: true
    limit_data: true
    limit_data_value: 1000   # small subset keeps a laptop run feasible
    num_workers: 2

    threads: 1               # MPS is a single shared GPU
    train_timeout: 3600

    # Multi-objective: accuracy up, FLOPs down
    multi_objective: True
    num_objectives: 2
    objectives: ['best_accuracy', 'total_flops']
    metrics:
      - name: Accuracy
      - name: HardwareMetrics
