# Configuration file 1 : group 1

QNAS:
    crossover_rate: 0.5
    max_generations: 150
    max_num_nodes: 20
    num_quantum_ind: 5
    penalize_number: 3
    repetition: 4
    replace_method: best
    update_quantum_gen: 1
    crossover_frequency: 1
    pop_crossover_rate: 0.4 # offspring replacement proportion in the population
    pop_crossover_method: ['hux', 'one_point', 'two_point'] # 'hux' | 'one_point' | 'two_point'
    patience: 60
    elite_mode: global_k # "single" | "global_k" | "bootstrap_k" | "old"
    k_elites: 5
    pool_factor: 3
    ema_beta: 0.7
    rank_weighting: True
    initial_prob_distribution: from_config # from_config | uniform

    # --- Network Architecture Rules ---
    terminal_op_name: "no_op"
    pool_op_name: "pool"
    min_active_len: 5
    truncate_after_noop: true
    avoid_consecutive_pool: true
    enforce_noop_in_update: true
    noop_max_prob: 0.9
    noop_ramp_cap: true

    quantum_update_config:
      quantum_rate_schedule: 'static'                     # use 'cosine' schedule or 'static'
      max_update_schedule: 'static'                       # use 'cosine' schedule or 'static'
      static_quantum_rate: 0.1                            # (Your old 0.4 / 5)
      static_max_update: 0.02                             # (Your old 0.105 / 5)
      quantum_rate_schedule_params:                       # Parameters for 'cosine' rate schedule
          start: 0.25                                      # Scaled down from 0.4
          end: 0.01                                       # Scaled down from ~0.01
      max_update_schedule_params:                         # Parameters for 'cosine' max_update schedule
          start: 0.3                                      # Scaled down from 1.5
          end: 0.16                                       # Scaled down from 0.8
      intensity_min: 0.5                                  # Intensity sampling range - not used
      intensity_max: 1.0                                  # Intensity sampling range - not used

    params_ranges:
      decay: 0.9
      learning_rate: 0.001
      momentum: 0.0
      weight_decay: 1.0e-4
      backbone_percentage: [0.1, 0.999]

    function_dict:  {'conv_1_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 1, 'strides': 1, 'filters': 32}, 'prob': 1.0/3.0/8.0},
                     'conv_1_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 1, 'strides': 1, 'filters': 64}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 32}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 64}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_128': {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 128}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_256': {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 256}, 'prob': 1.0/3.0/8.0},
                     'conv_5_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 5, 'strides': 1, 'filters': 32}, 'prob': 1.0/3.0/8.0},
                     'conv_5_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 5, 'strides': 1, 'filters': 64}, 'prob': 1.0/3.0/8.0},
                     'max_pool_2_2': {'function': 'MaxPooling', 'params': {'kernel': 2, 'strides': 2}, 'prob': 1.0/3.0/2.0},
                     'avg_pool_2_2': {'function': 'AvgPooling', 'params': {'kernel': 2, 'strides': 2}, 'prob': 1.0/3.0/2.0},
                     'no_op':        {'function': 'NoOp', 'params': {}, 'prob': 1.0/3.0}}

train:
    batch_size: 256
    eval_batch_size: 256
    max_epochs: 50
    epochs_to_eval: 5 
    eval_window_agg: max   # how best_accuracy is aggregated over the eval window: max | mean | last
    optimizer: AdamW
    precision: bf16
    device: cuda:0

    # Dataset
    dataset: Cifar10
    config_path_dataset: dataset_configs/cifar10.yaml   # <— updated key (points to your YAML)
    data_path: /path/to/datasets/cifar10        # set this to your local path
    train_split: 0.9
    split_seed: 2025                             # controls split & balanced limiting
    loader_seed: 777                             # controls DataLoader shuffling
    download: true                               # safe even if files already exist
    stats_max_batches: 10                        # used only if YAML sets stats_mode: sample
    data_augmentation: false
    subtract_mean: true
    limit_data: true
    limit_data_value: 10000
    num_workers: 4

    # Hardware settings - parallelization
    threads: 20

    # Network structure Configuration
    network_config: default
    backbone_name: mobilenet_v3_small

    # Multi-objective parameters
    multi_objective: False
    num_objectives: 3
    objectives: ['best_accuracy', 'total_params', 'cuda_inference_time'] # 'scalar_multi_objective', fitness_val_loss
    metrics:
      - name: Accuracy
      - name: HardwareMetrics
      - name: ValidationLossFitness
      - name: ScalarizedFitness
        params:
          metric_type: loss
          max_params: 114090
          max_inference_time: 1000
    artifacts:
      - name: ConfusionMatrix
