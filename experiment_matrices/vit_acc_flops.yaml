# NSGA-III on (best_accuracy, total_flops) over the ViT attention-head
# pruning space, 3 repeats.
#
# Prerequisite (once):
#   python run_darts_alphas.py --output darts_alphas/vit_base_cifar10.json
#
# Run:      python launch.py experiment_matrices/vit_acc_flops.yaml
# Preview:  python launch.py experiment_matrices/vit_acc_flops.yaml --dry-run
# Resume:   python launch.py experiment_matrices/vit_acc_flops.yaml --resume
exp_root: experiment_vit_acc_flops
gpus: [0]
repeats: 3
seed_base: 42        # repeats use seeds 43, 44, 45

defaults:
  data_path: data
  dataset: cifar10
  config_path_dataset: dataset_configs/cifar10_vit.yaml
  log_level: INFO
  multi_objective: true
  population_size: 12
  num_generations: 20
  limit_data_value: 1000     # explicit: the CLI default (10000) overrides the config
  use_cache: true

experiments:
  - {algo: nsga3, config: experiment_configs/vit/config_vit_heads.yaml, name: nsga3,
     overrides: {ref_divisions: 12}}
