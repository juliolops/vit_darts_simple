# Quick smoke test: MO-QNAS only, (best_accuracy, total_flops), on a SINGLE GPU
# (specifically physical GPU 1). 3 repeats × 5 generations to validate the full
# pipeline end-to-end (bf16, workers_per_gpu, checkpoint/resume) before running
# the full acc_flops.yaml matrix.
#
# Run with:   python launch.py experiment_matrices/moqnas_acc_flops_test.yaml
# Preview:    python launch.py experiment_matrices/moqnas_acc_flops_test.yaml --dry-run
# Resume:     python launch.py experiment_matrices/moqnas_acc_flops_test.yaml --resume
exp_root: experiment_cifar10_moqnas_test
gpus: [1]            # physical GPU 1 (CUDA_VISIBLE_DEVICES=1)
gpus_per_run: 1      # one GPU per run
repeats: 3
seed_base: 42        # repeats use seeds 43, 44, 45

defaults:
  data_path: datasets/cifar10_data
  dataset: cifar10
  config_path_dataset: dataset_configs/cifar10.yaml
  log_level: INFO
  multi_objective: true       # keep the config's multi-objective setting
  num_generations: 5          # short test (overrides moqnas max_generations)
  workers_per_gpu: 10         # 10 candidates evaluated concurrently per GPU
  use_cache: true              # cache results to speed up repeated runs (e.g. for debugging)

experiments:
  - {algo: moqnas, config: experiment_configs/cifar_mo/config0_3_acc_flops.yaml, name: moqnas}
