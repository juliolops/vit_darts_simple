# GA / NSGA-II / NSGA-III / MOEA-D family (replaces run_ea_1.sh).
# Add algorithms by listing more cells; no new shell script needed.
exp_root: experiment_cifar10_ea
gpus: [1]
repeats: 3
seed_base: 42

defaults:
  data_path: datasets/cifar10_data
  dataset: cifar10
  config_path_dataset: dataset_configs/cifar10.yaml
  limit_data_value: 10000
  fitness_metric: best_accuracy
  network_config: default
  backbone_name: resnet18
  log_level: INFO
  population_size: 20
  num_generations: 150
  max_num_nodes: 20
  crossover_rate: 0.5
  mutation_rate: 0.2
  mutation_strategy: standard
  patience: 60
  elitism: true            # store_true flag

experiments:
  - {algo: ga,    config: experiment_configs/cifar/config0.yaml, name: exp4}
  # - {algo: nsga2, config: experiment_configs/cifar/config0.yaml, name: exp4}
  # - {algo: nsga3, config: experiment_configs/cifar/config0.yaml, name: exp4,
  #    overrides: {ref_divisions: 12}}
  # - {algo: moead, config: experiment_configs/cifar/config0.yaml, name: exp4,
  #    overrides: {ref_divisions: 12, moead_T: 20, moead_scalar: tchebycheff, moead_pneighbor: 0.9}}
