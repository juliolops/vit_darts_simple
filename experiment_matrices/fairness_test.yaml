# Smoke test: multi-objective fairness search (best_accuracy, fairness_spd,
# fairness_mean_tpr) for all four MO algorithms, 3 repeat × 100 generations.
#
# Training on person_bin_96 (binary person detection, 96×96, ImageFolder layout);
# fairness evaluated serially on FACET (datasets/facet_data/facet_eval.csv)
# after each parallel generation.
# Fairness eval is serial/spawn — workers_per_gpu controls only training
# concurrency. Use 8 workers to leave headroom for the fairness inference pass.
#
# Precision: bf16 (set in config0_3.yaml).
#
# Run with:   python launch.py experiment_matrices/fairness_test.yaml
# Preview:    python launch.py experiment_matrices/fairness_test.yaml --dry-run
# Resume:     python launch.py experiment_matrices/fairness_test.yaml --resume
exp_root: experiment_personbin_fairness_96
gpus: [0,1]            # physical GPU 0 (CUDA_VISIBLE_DEVICES=0)
gpus_per_run: 2      # one GPU per experiment, one experiment at a time
repeats: 3
seed_base: 42        # single repeat uses seed 43

defaults:
  data_path: datasets/personbin_data_96
  dataset: personbin
  config_path_dataset: dataset_configs/person_bin_96.yaml
  log_level: INFO
  multi_objective: true
  population_size: 24         # used by nsga2/nsga3/moead (ignored by moqnas)
  num_generations: 100          # short smoke test
  workers_per_gpu: 12          # 12 concurrent training workers; fairness eval is serial after
  use_cache: true             # cache results to speed up repeated runs (e.g. for debugging)

experiments:
  - {algo: moqnas, config: experiment_configs/fairness/config0_3.yaml, name: moqnas}
  - {algo: nsga2,  config: experiment_configs/fairness/config0_3.yaml, name: nsga2}
  - {algo: nsga3,  config: experiment_configs/fairness/config0_3.yaml, name: nsga3,
    overrides: {ref_divisions: 6}}
  - {algo: moead,  config: experiment_configs/fairness/config0_3.yaml, name: moead,
    overrides: {ref_divisions: 6, moead_T: 10, moead_scalar: tchebycheff, moead_pneighbor: 0.9}}
