# Smoke test: espacio mixto, todos los algoritmos, 5 generaciones.
# Run:   python launch.py experiment_matrices/smoke_mixed.yaml
# Dry:   python launch.py experiment_matrices/smoke_mixed.yaml --dry-run
exp_root: /tmp/smoke_mixed
gpus: [0, 1]
gpus_per_run: 2       # ambas GPUs por experimento (CUDA_VISIBLE_DEVICES=0,1)
repeats: 1
seed_base: 42

defaults:
  data_path: datasets/cifar10_data
  dataset: cifar10
  config_path_dataset: dataset_configs/cifar10.yaml
  log_level: INFO
  multi_objective: true
  population_size: 10        # pequeño para smoke
  num_generations: 5
  workers_per_gpu: 10        # 10 workers × 2 GPUs = 20 workers concurrentes
  use_cache: false

experiments:
  - {algo: moqnas, config: experiment_configs/cifar_mo/config0_5_mixed.yaml, name: moqnas}
  - {algo: nsga2,  config: experiment_configs/cifar_mo/config0_5_mixed.yaml, name: nsga2}
  - {algo: nsga3,  config: experiment_configs/cifar_mo/config0_5_mixed.yaml, name: nsga3,
    overrides: {ref_divisions: 4}}
  - {algo: moead,  config: experiment_configs/cifar_mo/config0_5_mixed.yaml, name: moead,
    overrides: {ref_divisions: 4, moead_T: 5, moead_scalar: tchebycheff, moead_pneighbor: 0.9}}
