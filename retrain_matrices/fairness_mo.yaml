# Retrain matrix for the 3-objective fairness experiments (person_bin_48).
# Objectives: best_accuracy (max), fairness_spd (min), fairness_mean_tpr (max).
#
# Run:
#   python launch_retrain.py retrain_matrices/fairness_mo.yaml --dry-run

gpus: [0]
gpus_per_run: 1
exp_root: experiment_personbin_fairness_48

defaults:
  data_path: datasets/personbin_data_48
  dataset: person_bin_48
  max_epochs: 100
  epochs_to_eval: 100
  num_repetitions: 1
  lr_scheduler: cosine
  optimizer: AdamW
  batch_size: 128
  eval_batch_size: 128
  log_level: INFO
  num_workers: 4
  patience_retrain: 30
  data_augmentation: true
  # keep_metrics: true  # uncomment to also evaluate FairnessMetric on retrained models (requires FACET CSV)

experiments:
  # Best accuracy ignoring fairness
  - algo: moqnas
    name: moqnas
    repeats: 1
    selection:
      type: weighted
      weights: {best_accuracy: 1.0}
      n: 1

  # Balanced: 50% accuracy, 30% spd fairness, 20% mean_tpr
  - algo: moqnas
    name: moqnas
    repeats: 1
    selection:
      type: weighted
      weights:
        best_accuracy: 0.5
        fairness_spd: 0.3
        fairness_mean_tpr: 0.2
      n: 2
