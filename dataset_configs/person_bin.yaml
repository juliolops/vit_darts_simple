# configs/person_bin.yaml
name: person_bin
family: custom_local
shape: [3, 224, 224]
num_classes: 2
task: classification
stats_mode: known
mean: [0.485, 0.456, 0.406]
std:  [0.229, 0.224, 0.225]
balanced_train: false

# Optional hints used by build_transforms (if you read them there)
transform:
  img_size: 224   # used for Resize→CenterCrop / RandomResizedCrop in person/face branch